name: Publish

on:
  workflow_call:

# id-token: write is required for npm trusted publishing (OIDC).
# Do not set NODE_AUTH_TOKEN or registry-url: either overrides OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Publish if version is new
        working-directory: apps/create-ggstack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "create-ggstack@$VERSION" version >/dev/null 2>&1; then
            echo "create-ggstack@$VERSION already on npm — skipping"
            exit 0
          fi
          pnpm publish --no-git-checks --access public
